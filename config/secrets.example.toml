# 密钥模板：只有占位值，可提交。
# 真实文件在 ~/.config/mooapp/secrets.toml（权限 600），由 scripts/stage0_bootstrap.sh 在你自己的终端里生成。
# 不要把真实值写进本文件或仓库中的任何文件。
# 交易解锁密码不在这里：REAL 启动时用 getpass 现场输入，不落盘。

[smtp]
host = "smtp.mail.com"
port = 587
username = "your_name@gmail.com"
app_password = "CHNGE_ME"

[opend]
# 只在用 moomoo 桌面客户端的应用连接且要求 token 时需要；独立版 OpenD 留空
token = ""

[accounts]
# 实盘账户 acc_id（Q14）。模拟账户不在这里，在 config/broker.toml 的 simulate_acc_id
real_acc_id = 0

[postgres]
# mooapp_real 角色的密码（scram-sha-256，SPEC Q20）。模拟库的密码不在这里，在 config/db.local.toml
real_password = "CHANGE_ME"
